<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusVillain - Onboarding</title>
    <style>
        body { background-color: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #1e1e2f; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; margin: auto; border: 1px solid #3b3b5c; margin-bottom: 20px; }
        button { background: #8a2be2; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; font-weight: bold; }
        button:hover { background: #6a1b9a; }
        button:disabled { background: #555; cursor: not-allowed; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #3b3b5c; background: #2a2a40; color: white; box-sizing: border-box; font-size: 15px; }
    
        /* Forms හංගලා තියෙන්නේ මුලින් */
        #detailsForm, #aiQuizForm { display: none; } 
        
        /* Quiz ප්‍රශ්න වලට අදාළ ස්ටයිල් */
        .question-block { margin-bottom: 20px; text-align: left; background: #2a2a40; padding: 15px; border-radius: 8px; }
        .question-title { font-weight: bold; margin-bottom: 10px; font-size: 15px; color: #00ffcc; }
        .radio-label { display: block; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .radio-label input { width: auto; margin-right: 10px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN BOX -->
    <div class="box" id="loginBox">
        <h2>FocusVillain Login</h2>
        <p style="color: #a0a0a0; font-size: 14px;">Let's build your Command Center</p>
        <button id="googleBtn">Sign in with Google</button>
        <p id="status" style="color: #00ffcc; margin-top: 15px; font-size: 14px;"></p>
    </div>

    <!-- 2. DETAILS FORM -->
    <div class="box" id="detailsForm">
        <h2>Tell us about you</h2>
        
        <input type="text" id="userName" placeholder="Your Name">
        <input type="text" id="userCountry" placeholder="Country">
        <input type="number" id="userAge" placeholder="Age">
        
        <select id="userGoal">
            <option value="" disabled selected>What is your main goal?</option>
            <option value="Exams">Exams (School/University)</option>
            <option value="Tech / Coding">Tech / Coding</option>
            <option value="Trading / Finance">Trading / Finance</option>
            <option value="Fitness / Health">Fitness / Health</option>
            <option value="Business / Startup">Business / Startup</option>
            <option value="Creative">Creative (Art, Music, Writing)</option>
            <option value="Language">Language Learning</option>
            <option value="Career / Jobs">Career / Jobs</option>
            <option value="Personal Growth">Personal Growth</option>
            <option value="Other">Other</option>
        </select>
        
        <button id="submitDetailsBtn">Submit & Continue</button>
    </div>

    <!-- 3. AI QUIZ FORM -->
    <div class="box" id="aiQuizForm">
        <h2>AI Generated Quiz</h2>
        <p style="color: #a0a0a0; font-size: 14px;">Answer these to customize your plan</p>
        
        <div id="quizContainer"></div>
        
        <button id="submitQuizBtn">Finish & Save</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBe0ia1FGw2poDTonlXi0V2LvRQGwi8CX4",
            authDomain: "focusai-7fe3c.firebaseapp.com",
            projectId: "focusai-7fe3c",
            storageBucket: "focusai-7fe3c.firebasestorage.app",
            messagingSenderId: "761646577346",
            appId: "1:761646577346:web:42d5c1b2bd9fd8fe846d5b",
            measurementId: "G-0T6JWZRD7X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null; 
        let generatedQuestions = [];

        // 1. Google Login එක
        document.getElementById('googleBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    currentUser = result.user;
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('detailsForm').style.display = 'block';
                    document.getElementById('userName').value = result.user.displayName || "";
                }).catch((error) => {
                    document.getElementById('status').innerText = "Error: " + error.message;
                });
        });

        // 2. ප්‍රශ්න 4 Submit කරන කොටස
        document.getElementById('submitDetailsBtn').addEventListener('click', async () => {
            const name = document.getElementById('userName').value;
            const country = document.getElementById('userCountry').value;
            const age = document.getElementById('userAge').value;
            const goal = document.getElementById('userGoal').value;

            if(!name || !country || !age || !goal) {
                alert("Please fill all the details!");
                return;
            }

            const btn = document.getElementById('submitDetailsBtn');
            btn.innerText = "Analyzing goal (Wait ~30s)...";
            btn.disabled = true;

            try {
                const token = await currentUser.getIdToken();

                // Onboard API එකට යවනවා
                const onboardRes = await fetch('https://focusvillain-server.onrender.com/api/onboard', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        userName: name,
                        userCountry: country,
                        userAge: age,
                        userGoal: goal,
                        lang: 'en'
                    })
                });

                const onboardData = await onboardRes.json();
                if (!onboardRes.ok) throw new Error(onboardData.error || "Onboard failed");

                // Quiz ප්‍රශ්න ඉල්ලනවා
                btn.innerText = "Generating quiz...";
                
                const quizRes = await fetch('https://focusvillain-server.onrender.com/api/quiz/generate', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const quizData = await quizRes.json();
                if (!quizRes.ok) throw new Error(quizData.error || "Quiz generation failed");

                // ප්‍රශ්න ආවම ඒක UI එකේ පෙන්නනවා
                generatedQuestions = quizData.questions;
                showQuizUI(generatedQuestions);

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
                btn.innerText = "Submit & Continue";
                btn.disabled = false;
            }
        });

        // 3. Quiz UI එක හදන Function එක
        function showQuizUI(questions) {
            document.getElementById('detailsForm').style.display = 'none';
            document.getElementById('aiQuizForm').style.display = 'block';

            const container = document.getElementById('quizContainer');
            container.innerHTML = ''; 

            questions.forEach((q, index) => {
                let html = `<div class="question-block">
                                <div class="question-title">${index + 1}. ${q.question}</div>`;
                
                q.options.forEach(opt => {
                    html += `<label class="radio-label">
                                <input type="radio" name="q_${q.id}" value="${opt}">
                                ${opt}
                             </label>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        // 4. Quiz එක ඉවර කරලා Save කරන කොටස
        document.getElementById('submitQuizBtn').addEventListener('click', async () => {
            const answers = [];
            let allAnswered = true;

            generatedQuestions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (selected) {
                    answers.push({ id: q.id, question: q.question, answer: selected.value });
                } else {
                    allAnswered = false;
                }
            });

            if (!allAnswered) {
                alert("Please answer all questions!");
                return;
            }

            const btn = document.getElementById('submitQuizBtn');
            btn.innerText = "Saving...";
            btn.disabled = true;

            try {
                const token = await currentUser.getIdToken();
                const res = await fetch('https://focusvillain-server.onrender.com/api/quiz/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ answers })
                });

              if (res.ok) {
    window.location.href = "dashboard.html";
} else {
    throw new Error("Failed to save answers");
              }
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.innerText = "Finish & Save";
                btn.disabled = false;
            }
        });

    </script>
</body>
</html>

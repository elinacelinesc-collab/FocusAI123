<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusVillain - Login</title>
    <style>
        body { background-color: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #1e1e2f; padding: 30px; border-radius: 15px; width: 90%; max-width: 350px; margin: auto; border: 1px solid #3b3b5c; }
        button { background: #8a2be2; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; font-weight: bold; }
        button:hover { background: #6a1b9a; }
        button:disabled { background: #555; cursor: not-allowed; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #3b3b5c; background: #2a2a40; color: white; box-sizing: border-box; }
    
        #detailsForm { display: none; } 
    </style>
</head>
<body>

    <!-- 1. LOGIN BOX -->
    <div class="box" id="loginBox">
        <h2>FocusVillain Login</h2>
        <p style="color: #a0a0a0; font-size: 14px;">Let's build your Command Center</p>
        <button id="googleBtn">Sign in with Google</button>
        <p id="status" style="color: #00ffcc; margin-top: 15px; font-size: 14px;"></p>
    </div>

    <!-- 2. DETAILS FORM -->
    <div class="box" id="detailsForm">
        <h2>Tell us about you</h2>
        
        <input type="text" id="userName" placeholder="Your Name">
        <input type="text" id="userCountry" placeholder="Country">
        <input type="number" id="userAge" placeholder="Age">
        
        <select id="userGoal">
            <option value="" disabled selected>What is your main goal?</option>
            <option value="Academic">Academic (School/Uni)</option>
            <option value="Business">Business / Entrepreneurship</option>
            <option value="Tech">Tech / Programming</option>
            <option value="Creative">Creative Arts / Design</option>
            <option value="Health">Health / Fitness</option>
        </select>
        
        <button id="submitDetailsBtn">Submit & Continue</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        
        const firebaseConfig = {
  apiKey: "AIzaSyBe0ia1FGw2poDTonlXi0V2LvRQGwi8CX4",
  authDomain: "focusai-7fe3c.firebaseapp.com",
  projectId: "focusai-7fe3c",
  storageBucket: "focusai-7fe3c.firebasestorage.app",
  messagingSenderId: "761646577346",
  appId: "1:761646577346:web:42d5c1b2bd9fd8fe846d5b",
  measurementId: "G-0T6JWZRD7X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null; 
        
document.getElementById('submitDetailsBtn').addEventListener('click', async () => {
    const name = document.getElementById('userName').value;
    const country = document.getElementById('userCountry').value;
    const age = document.getElementById('userAge').value;
    const goal = document.getElementById('userGoal').value;

    if(!name || !country || !age || !goal) {
        alert("Please fill all the details!");
        return;
    }

    const btn = document.getElementById('submitDetailsBtn');
    btn.innerText = "Analyzing your goal...";
    btn.disabled = true;

    try {
        const token = await currentUser.getIdToken();

        // 1. Onboard API එකට යවනවා
        const onboardRes = await fetch('https://focusvillain-server.onrender.com/api/onboard', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                userName: name,
                userCountry: country,
                userAge: age,
                userGoal: goal,
                lang: 'en'
            })
        });

        const onboardData = await onboardRes.json();

        if (!onboardRes.ok) {
            throw new Error(onboardData.error || "Onboard failed");
        }

        // 2. Quiz ප්‍රශ්න ඉල්ලනවා
        btn.innerText = "Generating your quiz...";
        
        const quizRes = await fetch('https://focusvillain-server.onrender.com/api/quiz/generate', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const quizData = await quizRes.json();
        
        if (!quizRes.ok) {
            throw new Error(quizData.error || "Quiz generation failed");
        }

        // 3. ප්‍රශ්න ආවම, ඒක Form එකේ පෙන්නනවා (මේක අපි ඊළඟට ලස්සනට හදමු)
        alert("Success! We generated " + quizData.questions.length + " questions for you.");
        console.log(quizData.questions); // කොන්සෝල් එකේ බලාගන්න පුළුවන් ප්‍රශ්න ටික

    } catch (error) {
        console.error(error);
        alert("Error: " + error.message);
    } finally {
        btn.innerText = "Submit & Continue";
        btn.disabled = false;
    }
});
        
    </script>
</body>
</html>
